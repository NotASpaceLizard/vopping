<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grocery List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Grocery List</h1>
    <div class="global-controls">
      <button type="button" id="undo-btn" disabled>Undo</button>
      <!-- Terminology (locked AC, 2026-09-04): user-facing text for S12/S3
           renamed "checked"/"check" -> "crossed off"/"cross off" - id kept
           stable (internal, not user-visible), only the label text changed. -->
      <button type="button" id="clear-checked-btn" disabled>Clear crossed off</button>
      <!-- S21: settings entry point. GLYPH IS A PLACEHOLDER (U+2699 GEAR) -
           plain monochrome Unicode symbol, never a colored emoji; flagged for
           the PO's final pick, same pattern as S16/S7's icon picks. -->
      <button type="button" id="settings-btn" class="settings-btn" title="Settings" aria-label="Settings" data-static-icon="settings-gear">⚙</button>
    </div>
  </header>

  <!-- S1: always-visible single-item add control. Enter submits via the
       <form>'s own default behavior - no separate keydown handling needed. -->
  <form id="add-form" class="add-form">
    <input type="text" id="add-input" placeholder="Add an item…" autocomplete="off">
    <button type="submit">Add</button>
  </form>

  <!-- S4: paste-to-ingest bulk add, a separate control from the single-item
       input above. Collapsed by default so it doesn't compete for space
       with the primary single-add flow on a small phone screen. -->
  <details class="paste-panel">
    <summary>Paste a list</summary>
    <form id="paste-form" class="paste-form">
      <textarea id="paste-input" placeholder="Paste items, one per line…" rows="4"></textarea>
      <button type="submit">Add all</button>
    </form>
  </details>

  <!-- S10: "What am I missing?" suggestion chips - populated by script.js's
       renderSuggestions(), hidden entirely when there are none. -->
  <div id="suggestions-root" class="suggestions-root" hidden></div>

  <!-- S9: sort control - view-only, in-memory (script.js's sortMode),
       resets to Manual on reload. -->
  <div class="sort-controls">
    <label for="sort-select">Sort:</label>
    <select id="sort-select">
      <option value="manual">Manual</option>
      <option value="alpha">Alphabetical</option>
      <option value="aisle">By Aisle</option>
    </select>
    <!-- S31: list-wide fill-empty-only "Auto-aisle" run. Lives HERE in
         .sort-controls (NOT .global-controls) as an isolated element with its
         own click listener - introduces no per-row / R14 surface. Glyph ⭍
         (U+2B4D) + text label; ↯ (U+21AF) is the NB-6 on-device fallback if ⭍
         tofu-boxes on iOS. Plain monochrome Unicode (no emoji). The glyph is
         aria-hidden - the "Auto-aisle" text carries the accessible name. -->
    <button type="button" id="auto-aisle-btn" class="auto-aisle-btn"><span class="auto-aisle-glyph" data-static-icon="auto-aisle-run" aria-hidden="true">⭍</span> Auto-aisle</button>
  </div>

  <!-- Row density/interaction - LOCKED, 2026-09-04 (PO's final pick from
       density-picker.html): whole row is the tap target for crossing off,
       no checkbox/dot glyph. Rendered entirely by script.js - see its
       renderList()/event-delegation comments for the actual markup and the
       nested-control-precedence handling for S13's drag pickup/Delete
       (S13 supersedes the earlier Up/Down buttons - see script.js). -->
  <main id="list-root">
  </main>

  <!-- S3: brief "Deleted '<item>' — Undo" toast, shown in addition to the
       always-visible Undo control above, not instead of it. -->
  <div id="toast" class="toast" hidden></div>

  <!-- S21: settings menu shell. Hidden by default; opened by #settings-btn.
       Closes via the explicit X control OR a tap on the scrim/outside the
       panel (Escape is an optional extra, keyboard-only nav is out of scope).
       The panel body is populated by script.js's renderSettings() - its first
       real content is S23's aisle management. -->
  <div id="settings-overlay" class="settings-overlay" hidden>
    <div class="settings-scrim" data-role="settings-scrim"></div>
    <div class="settings-panel" role="dialog" aria-modal="true" aria-label="Settings">
      <div class="settings-panel-header">
        <h2 class="settings-title">Settings</h2>
        <button type="button" class="settings-close" data-role="settings-close" title="Close" aria-label="Close settings" data-static-icon="settings-close">✕</button>
      </div>
      <div id="settings-body" class="settings-body"></div>
    </div>
  </div>

  <!-- S29: the Auto-Aisle item->aisle dictionary. MUST load BEFORE script.js so
       window.AISLE_DICTIONARY is present when the matcher builds its lookup at
       init. Readable, hand-editable data file (the PO edits it directly). -->
  <script src="aisle-dictionary.js"></script>
  <script src="script.js"></script>
</body>
</html>
